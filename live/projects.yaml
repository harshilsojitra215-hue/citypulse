# Project registry. Add a project = add a block here. No code change.
# keywords   : generic words. A hit only counts together with a place word.
# specific   : phrases that count on their own.
# place_words: words that tie a generic keyword to this project.
# queries    : what the search-style sources (GDELT, Google News, Bluesky) ask for, per language.
# hashtags   : Mastodon tag timelines to read (without #).
# comparison_group: planned_cablecar | operating_cablecar | other_project (for the Compare view).
# start_date : first public milestone we know of (context only, not a filter).
defaults:
  since: 2026-10-27          # dataset end; override with --since
  user_agent: "city-debate-monitor/0.1 (research prototype; hackathon, contact via project team)"
  http_timeout_s: 30
  dataset_edge: "2026-10-27T12:29:00+0000"   # end of the city's historical export; older items first seen later are flagged late_discovered
  http_retries: 2
  # Printed in every run receipt as coverage gaps (what this collector cannot see, whatever the run result).
  known_not_covered:
    - "Instagram, Facebook, TikTok, LinkedIn, X: no legal open access (needs a vendor or research contract)"
    - "Reddit: official API needs approval, not set up. Reddit and the other social platforms appear only as search-result links (title, snippet), never opened"
    - "YouTube: only videos and comments the YouTube search returns for our queries (daily quota); texts older than 30 days are removed (API terms)"
    - "Heilbronner Stimme and echo24: paywall or no feed; only what Exa and Tavily index (Google News is off)"
    - "Citizen participation platforms (comments): no export, not collected"
    - "Local radio, TV, podcasts: not collected"
    - "GDELT (news index): switched off, rate limited (HTTP 429) from our network on 14 Nov, retest needed"
    - "Google News RSS: switched off, robots.txt disallows /rss. Without it and GDELT, news comes only from Exa and Tavily (what they index) and five outlet RSS feeds (a few days each), so news coverage is thinner than the city's monitoring tool"

