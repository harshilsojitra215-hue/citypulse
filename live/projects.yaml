# Sources. enabled=false is allowed; a source that is gated or needs a key is listed with the reason.
sources:
  gdelt:
    enabled: false           # OFF since 14 Nov 2026: HTTP 429 on 11 of 12 requests from our network even at 6 to 20 s spacing (experiments/logs/exp2_gdelt_probe.log). Retest, then set true.
    min_interval_s: 6        # GDELT asks for 1 request per 5 s
    max_records: 250
  gnews:
    enabled: false           # OFF by default (decision 14 Nov 2026): news.google.com/robots.txt has "Disallow: /" and no allowance for /rss.
                             # The adapter stays for tests and for a later licence or permission. See STADT_LIVE_SOURCES.md and STADT_LIVE_EXPERIMENTS.md.
    min_interval_s: 2
  rss:
    enabled: true
    min_interval_s: 1.5
    feeds:
      - {id: heilbronn_de,   url: "https://www.heilbronn.de/startseite.xml",       outlet: heilbronn.de,  language: de, country: DE, kind: official}
      - {id: swr_bw,         url: "https://www.swr.de/~rss/swraktuell-bw-100.xml", outlet: swr.de,        language: de, country: DE, kind: news}
      - {id: ga_bonn,        url: "https://ga.de/feed.rss",                        outlet: ga.de,         language: de, country: DE, kind: news}
      - {id: franceinfo,     url: "https://www.francetvinfo.fr/titres.rss",        outlet: francetvinfo.fr, language: fr, country: FR, kind: news}
      - {id: 20minutes,      url: "https://www.20minutes.fr/feeds/rss-une.xml",    outlet: 20minutes.fr,  language: fr, country: FR, kind: news}
  bluesky:
    enabled: true
    min_interval_s: 1.5
    max_pages: 3
  mastodon:
    enabled: true
    min_interval_s: 1.5
    max_pages: 3
    # troet.cafe answered HTTP 422 for every hashtag timeline on 14 Nov 2026 (tested), so it is left out until it works again.
    instances: [mastodon.social]
  oparl:
    enabled: true
    min_interval_s: 1.0
    max_pages: 80
    endpoints:
      - {id: heilbronn, project_city: Heilbronn, system: "https://heilbronn-sitzungsdienst.komm.one/oparl/system", licence: "dl-de/zero-2-0"}
      # Bonn's official endpoint sits behind a proof-of-work gate (ALTCHA) since Feb 2026. We do NOT solve it.
      # The adapter requests it once per run; if it is still gated the run log says "gated" and moves on.
      - {id: bonn, project_city: Bonn, system: "https://www.bonn.sitzung-online.de/public/oparl/system", licence: "CC0 (city open-data page)"}
  pagewatch:
    enabled: true
    min_interval_s: 2.0
    # Official pages. One request per page per run. Changes are reported with a short text diff.
    pages:
      - {id: hn_seilbahn,   project: heilbronn_cablecar, url: "https://www.heilbronn.de/umwelt-mobilitaet/mobilitaet/seilbahn.html", title: "Heilbronn Seilbahn (project page with FAQ)", outlet: heilbronn.de, language: de, country: DE}
      - {id: bonn_seilbahn, project: bonn_cablecar,      url: "https://www.bonn.de/themen-entdecken/verkehr-mobilitaet/seilbahn/Seilbahn.php", title: "Bonn Seilbahn project page", outlet: bonn.de, language: de, country: DE}
      - {id: bonn_downloads, project: bonn_cablecar,     url: "https://www.bonn.de/themen-entdecken/verkehr-mobilitaet/seilbahn/inhaltsseiten/downloads-zum-thema-seilbahn.php", title: "Bonn Seilbahn documents list", outlet: bonn.de, language: de, country: DE}
      - {id: idfm_c1,       project: paris_c1,           url: "https://www.iledefrance-mobilites.fr/le-reseau/projets/cablec1", title: "IDFM Cable C1 project page", outlet: iledefrance-mobilites.fr, language: fr, country: FR}
      - {id: idfm_c1_news,  project: paris_c1,           url: "https://www.iledefrance-mobilites.fr/le-reseau/projets/cablec1/actualites", title: "IDFM Cable C1 news list", outlet: iledefrance-mobilites.fr, language: fr, country: FR}
  # ---- key-based discovery sources (live/RADAR_SETUP.md). No key = skipped with a line in the receipt. Keys come from the
  # environment variable named in key_env or from live/.env (gitignored). Site-scoped queries find links on Reddit, Facebook,
  # Instagram, X, TikTok, YouTube and German forums: link, title, snippet, date only. Those pages are never opened.
  exa:
    enabled: true
    key_env: EXA_API_KEY
    min_interval_s: 1
    max_queries_per_project: 2
    max_site_queries_per_project: 5
    num_results: 5
    fulltext: true             # read the page only where robots.txt allows; else snippet only
    max_fulltext_per_run: 60
  tavily:
    enabled: true
    key_env: TAVILY_API_KEY
    min_interval_s: 1
    max_queries_per_project: 3
    max_site_queries_per_project: 7
    max_results: 10
    topics: [general, news]
    fulltext: true
    max_fulltext_per_run: 60
  youtube:
    enabled: true
    key_env: YOUTUBE_API_KEY
    min_interval_s: 0.5
    max_queries_per_project: 2
    max_videos: 8
    max_comment_pages: 2
    max_search_calls: 30        # the API allows 100 search calls a day (coordinator cap for the stage run)
    include_older_videos: true  # also look at older relevant videos; only comments newer than --since are kept
  apify:
    enabled: false              # discovery only (Google results for site-scoped queries). Off until APIFY_TOKEN exists and the owner agrees, see apify.py
    key_env: APIFY_TOKEN
    actor: apify/google-search-scraper
    min_interval_s: 1
    max_queries_per_project: 3
    max_site_queries_per_project: 7
    max_results_per_query: 10
    max_total_usd: 4.0
    fulltext: false
